<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Domain: https://studibits.com -->

    <!-- Primary SEO tags -->
    <title>StudioBits Tech | Web Development, Software & Digital Solutions</title>
    <meta
      name="description"
      content="StudioBits Tech builds intelligent software, scalable digital solutions, and transformative technology services that help businesses grow. Web development, custom software, and UI/UX design in Kerala, India."
    />
    <meta
      name="keywords"
      content="StudioBits, web development Kerala, software company Kerala, custom software development, UI UX design, digital solutions, tech company India"
    />
    <meta name="author" content="StudioBits Tech" />
    <link rel="canonical" href="https://studibits.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudioBits Tech" />
    <meta property="og:title" content="StudioBits Tech | Web Development, Software & Digital Solutions" />
    <meta
      property="og:description"
      content="We help businesses embrace the future through intelligent software, scalable digital solutions, and transformative technology services."
    />
    <meta property="og:image" content="https://studibits.com/og-image.png" />
    <meta property="og:url" content="https://studibits.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudioBits Tech | Web Development, Software & Digital Solutions" />
    <meta
      name="twitter:description"
      content="We help businesses embrace the future through intelligent software, scalable digital solutions, and transformative technology services."
    />
    <meta name="twitter:image" content="https://studibits.com/og-image.png" />

    <!-- Structured data: local business, helps Google show rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "StudioBits Tech",
        "description": "Digital product studio offering web development, software engineering, and technology solutions.",
        "url": "https://studibits.com",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Kerala",
          "addressCountry": "IN"
        },
        "sameAs": []
      }
    </script>

    <!-- Cursive font used by the logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Meddon&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
